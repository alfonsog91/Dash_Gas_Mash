name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@******d******c************e5aac5ba8058******5da76************0c******8************7******ba90b****** # v7

      - name: Inject Mapbox Token
        run: |
          TOKEN_SCRIPT="<script>window.DASH_MAPBOX_TOKEN='${{ secrets.MAPBOX_TOKEN }}';</script>"
          sed -i "s|<head>|<head>${TOKEN_SCRIPT}|" index.html  

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
